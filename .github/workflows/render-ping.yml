name: Render Keep-Alive

on:
  schedule:
    # Runs every 10 minutes — Render free-tier services spin down after 15 min of inactivity
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend
        run: curl -sf --max-time 90 "${{ secrets.RENDER_BACKEND_URL }}" -o /dev/null
